/**:
  slam_node:
    ros__parameters:
      lidar_type: "Velodyne"
      lidar_topic: "/points_raw"
      imu_topic: "/imu_correct"
      tracking_frame_id: "base_link"
      lidar_frame_id: "velodyne"
      imu_frame_id: "imu_link"

      extrinsics:
        use_tf_extrinsic: false
        T_base_lidar_trans: [0.0, 0.0, 0.0]
        T_base_lidar_rot: [1.0, 0.0, 0.0, 0.0]
        T_base_imu_trans: [0.0, 0.0, 0.0]
        T_base_imu_rot: [1.0, 0.0, 0.0, 0.0]

      imu_preintegrator:
        type: "gtsam"
        gravity: 9.81
        # Microstrain IMU noise parameters (from LIO-SAM park dataset config).
        # These values come from Allan variance analysis of the sensor.
        # Using inflated values weakens gravity alignment and causes divergence.
        imu_acc_noise: 3.9939570888238808e-03
        imu_gyr_noise: 1.5636343949698187e-03
        imu_acc_bias_noise: 6.4356659353532566e-05
        imu_gyr_bias_noise: 3.5640318696367613e-05

      scan_preprocessor:
        type: "deskew"
        voxel_leaf_size: 0.8

      feature_extractor:
        type: "passthrough"

      scan_matcher:
        type: "ikd_tree"
        k_neighbors: 5
        max_iterations: 15
        convergence_threshold: 1e-3
        min_valid_points: 50
        degenerate_threshold: 10000.0
        max_search_dist: 1.0
        min_plane_points: 5
        plane_valid_threshold: 0.1
        rot_regularization_sigma: 0.01   # rad (~0.57°), 0 = disabled

      map_builder:
        type: "ikd_tree"
        keyframe_distance_threshold: 1.0
        keyframe_rotation_threshold: 0.2
        ikd_delete_param: 0.5
        ikd_balance_param: 0.6
        ikd_downsample_size: 0.5
        
      loop_closure:
        type: "ikd_tree"
        search_radius: 5.0
        min_time_gap_sec: 30.0
        scan_matcher:
          k_neighbors: 5
          max_iterations: 100
          convergence_threshold: 1e-5
          min_valid_points: 50
          degenerate_threshold: 10000.0
          min_plane_points: 5
          max_search_dist: 2.0
          plane_valid_threshold: 0.1

        
